<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Winter Storm Watch Verification Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background-color: #f9f9f9; }
    .select-container { margin-bottom: 20px; }
    .select-box { padding: 8px 12px; font-size: 15px; width: 300px; border-radius: 4px; border: 1px solid #ccc; background-color: white; }
    
    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 0 auto; }
    
    /* Tab Styling */
    .tab-container { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 15px; }
    .tab-button {
      padding: 8px 16px;
      border: none;
      background-color: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      outline: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-button.active {
      color: #003366;
      border-bottom: 3px solid #003366;
    }
    .tab-button:hover { color: #003366; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #003366; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body>

  <div class="select-container">
    <label for="stormSelect"><strong>Select Winter Storm Event:</strong></label><br>
    <select id="stormSelect" class="select-box" onchange="updateDashboard()">
      <option value="">-- Loading storms... --</option>
    </select>
  </div>

  <div class="content-grid">
    <!-- Map Display Card with Tabs -->
    <div class="card">
      <div class="tab-container">
        <button class="tab-button active" onclick="switchTab('conus')">CONUS Verification Map</button>
        <button class="tab-button" onclick="switchTab('zoomed')">Regional Difference (Zoomed)</button>
      </div>

      <!-- CONUS Tab Content -->
      <div id="conusTab" class="tab-content active">
        <img id="stormMap" src="" alt="Select a storm to view CONUS verification map">
      </div>

      <!-- Zoomed Tab Content -->
      <div id="zoomedTab" class="tab-content">
        <img id="zoomedMap" src="" alt="Select a storm to view zoomed map">
      </div>
    </div>

    <!-- Metrics Table -->
    <div class="card">
      <h3 style="margin-top:0;">Spatial Verification Metrics</h3>
      <table id="metricsTable">
        <thead>
          <tr><th>Metric</th><th>Value</th></tr>
        </thead>
        <tbody>
          <tr><td>Hit Rate (CSI)</td><td id="hitRate">-</td></tr>
          <tr><td>WPC Proposed Area</td><td id="wpcArea">-</td></tr>
          <tr><td>NWS Issued Area</td><td id="nwsArea">-</td></tr>
          <tr><td>Mutual Agreement Area</td><td id="agreeArea">-</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let stormDataList = [];

    async function loadAllStorms() {
      const selectBox = document.getElementById("stormSelect");
      stormDataList = [];

      const cacheBuster = `?t=${new Date().getTime()}`;

      try {
        const manifestResponse = await fetch(`manifest.json${cacheBuster}`);
        if (!manifestResponse.ok) throw new Error("Could not load manifest.json");
        
        const stormFiles = await manifestResponse.json();

        for (const fileName of stormFiles) {
          try {
            const response = await fetch(`${fileName}${cacheBuster}`);
            if (response.ok) {
              const data = await response.json();
              stormDataList.push(data);
            }
          } catch (err) {
            console.error(`Error loading ${fileName}:`, err);
          }
        }
      } catch (err) {
        console.error("Error reading manifest:", err);
      }

      selectBox.innerHTML = "";

      if (stormDataList.length === 0) {
        selectBox.innerHTML = '<option value="">No storms found</option>';
        return;
      }

      stormDataList.forEach((storm, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = storm.name || storm.id || storm.img_filename || `Storm ${index + 1}`;
        selectBox.appendChild(option);
      });

      updateDashboard();
    }

    function updateDashboard() {
      const selectBox = document.getElementById("stormSelect");
      const selectedIndex = selectBox.value;

      if (selectedIndex === "" || !stormDataList[selectedIndex]) return;

      const storm = stormDataList[selectedIndex];
      const cacheBuster = `?t=${new Date().getTime()}`;

      // 1. Set CONUS Map Image
      const imageFile = storm.img_filename || `${storm.id}.png`;
      document.getElementById("stormMap").src = `${imageFile}${cacheBuster}`;

      // 2. Set Zoomed Map Image (Checks JSON key or falls back to _zoomed.png)
      const baseName = imageFile.substring(0, imageFile.lastIndexOf('.')) || imageFile;
      const zoomedFile = storm.zoomed_img_filename || `${baseName}_zoomed.png`;
      document.getElementById("zoomedMap").src = `${zoomedFile}${cacheBuster}`;

      // 3. Update Table Metrics
      document.getElementById("hitRate").innerText = storm.hitRate || "-";
      document.getElementById("wpcArea").innerText = storm.wpcArea || "-";
      document.getElementById("nwsArea").innerText = storm.nwsArea || "-";
      document.getElementById("agreeArea").innerText = storm.agreeArea || "-";
    }

    // Tab Switching Logic
    function switchTab(tabName) {
      const buttons = document.querySelectorAll('.tab-button');
      const contents = document.querySelectorAll('.tab-content');

      buttons.forEach(btn => btn.classList.remove('active'));
      contents.forEach(content => content.classList.remove('active'));

      if (tabName === 'conus') {
        buttons[0].classList.add('active');
        document.getElementById('conusTab').classList.add('active');
      } else {
        buttons[1].classList.add('active');
        document.getElementById('zoomedTab').classList.add('active');
      }
    }

    window.onload = loadAllStorms;
  </script>
</body>
</html>
